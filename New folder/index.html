<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyDesk – Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar navigation -->
    <aside class="sidebar">
      <div class="brand"><span class="logo">✓</span><span>StudyDesk</span></div>
      <nav class="nav">
        <button class="nav-btn active" data-view="dashboard">🏠 <span>Dashboard</span></button>
        <button class="nav-btn" data-view="tasks">📋 <span>My Tasks</span></button>
        <button class="nav-btn" id="navAdd">＋ <span>New Task</span></button>
      </nav>
      <div class="side-foot">
        <p class="quote" id="quote"></p>
        <button class="theme-btn" id="themeBtn">🌙 Dark mode</button>
      </div>
    </aside>

    <main class="main">
      <!-- Dashboard view -->
      <section id="view-dashboard" class="view">
        <header class="page-head">
          <div>
            <h1 id="welcome">Welcome back!</h1>
            <p class="sub" id="today"></p>
          </div>
          <button class="btn primary" data-open-add>＋ Add task</button>
        </header>

        <div class="stats">
          <div class="card stat"><span class="stat-ico blue">📚</span><div><b id="sTotal">0</b><small>Total tasks</small></div></div>
          <div class="card stat"><span class="stat-ico green">✅</span><div><b id="sDone">0</b><small>Completed</small></div></div>
          <div class="card stat"><span class="stat-ico purple">⏳</span><div><b id="sPending">0</b><small>Pending</small></div></div>
          <div class="card stat"><span class="stat-ico red">⚠️</span><div><b id="sOverdue">0</b><small>Overdue</small></div></div>
        </div>

        <div class="card progress-card">
          <div class="row"><h2>Your progress</h2><b id="pct">0%</b></div>
          <div class="bar"><div class="bar-fill" id="barFill"></div></div>
          <p class="sub" id="progressMsg"></p>
        </div>

        <div class="card">
          <h2>Coming up</h2>
          <ul class="mini-list" id="upcoming"></ul>
        </div>
      </section>

      <!-- Tasks view -->
      <section id="view-tasks" class="view hidden">
        <header class="page-head">
          <div><h1>My Tasks</h1><p class="sub">Search, filter and sort your work.</p></div>
          <button class="btn primary" data-open-add>＋ Add task</button>
        </header>

        <div class="toolbar">
          <input type="search" id="search" placeholder="Search by title…" aria-label="Search tasks">
          <select id="subjectFilter" aria-label="Filter by subject"><option value="all">All subjects</option></select>
          <select id="sort" aria-label="Sort tasks">
            <option value="date">Sort: Due date</option>
            <option value="priority">Sort: Priority</option>
            <option value="created">Sort: Newest</option>
          </select>
        </div>

        <div class="chips" id="chips">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="pending">Pending</button>
          <button class="chip" data-filter="completed">Completed</button>
          <button class="chip" data-filter="overdue">Overdue</button>
        </div>

        <div id="taskList" class="task-list"></div>
      </section>
    </main>
  </div>

  <!-- Add / edit modal -->
  <div class="overlay hidden" id="modal">
    <form class="modal card" id="taskForm" novalidate>
      <h2 id="modalTitle">Add task</h2>
      <label>Title *<input id="fTitle" maxlength="80" placeholder="e.g. Algebra worksheet"></label>
      <p class="error" id="titleErr"></p>
      <label>Description<textarea id="fDesc" rows="3" placeholder="Details, pages, notes…"></textarea></label>
      <div class="grid2">
        <label>Subject
          <select id="fSubject">
            <option>Math</option><option>Science</option><option>English</option><option>Arabic</option>
            <option>History</option><option>Computer</option><option>Other</option>
          </select>
        </label>
        <label>Priority
          <select id="fPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
        </label>
      </div>
      <label>Due date<input type="date" id="fDue"></label>
      <div class="actions">
        <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save task</button>
      </div>
    </form>
  </div>

  <!-- Delete confirmation -->
  <div class="overlay hidden" id="confirm">
    <div class="modal card small">
      <h2>Delete this task?</h2>
      <p class="sub" id="confirmText"></p>
      <div class="actions">
        <button class="btn ghost" id="noDel">Keep it</button>
        <button class="btn danger" id="yesDel">Delete</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
